<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0b10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free AI-powered notes that answer questions from what you've written, turn any note into flashcards, and help you actually remember it — no ads, no paid tier." />
    <meta property="og:site_name" content="NoteMind" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NoteMind — Notes that think with you" />
    <meta property="og:description" content="Free AI notes that answer questions from what you've written, turn any note into flashcards, and help you actually remember it." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="NoteMind — Notes that think with you" />
    <meta name="twitter:description" content="Free AI notes that answer questions from what you've written, turn any note into flashcards, and help you actually remember it." />
    <title>NoteMind — Notes that think with you</title>
    <script>
      // Applies the saved/system theme to <html> before first paint, so
      // React mounting (and ThemeContext syncing its own state to this same
      // value) never causes a visible flash of the wrong theme.
      (function () {
        var saved = localStorage.getItem('theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body class="min-h-screen bg-gradient-to-br from-ink-deep via-ink-mid to-ink-edge text-ink font-sans leading-relaxed antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
